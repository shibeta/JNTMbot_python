name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新的提交会取消仍在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"  # 强制 Python 使用 UTF-8 模式
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 静默安装 ViGEmBus 驱动，避免卡在 pip install vgamepad 和 import vgamepad
      - name: Install ViGEmBus Driver from local MSI
        shell: pwsh
        run: |
          $msiPath = Join-Path $env:GITHUB_WORKSPACE "assets\虚拟手柄驱动ViGEmBusSetup_x64.msi"
          msiexec /i "$msiPath" /qn /norestart
          Write-Host "Waiting for ViGEmBus driver to settle..."
          Start-Sleep -Seconds 5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        shell: pwsh
        run: ruff check --output-format=github

      - name: Format Check (ruff format)
        shell: pwsh
        run: ruff format --check

      - name: Type check (mypy)
        shell: pwsh
        run: mypy

      - name: Unit tests (pytest)
        shell: pwsh
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70
